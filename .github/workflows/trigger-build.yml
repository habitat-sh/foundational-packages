name: Trigger Enterprise Build

on:
  push:
    branches:
      - base-2025
  # Allows manually re-running/testing this trigger from the Actions tab or
  # `gh workflow run`, independent of the push trigger required by the story.
  workflow_dispatch:
    inputs:
      foundational_ref:
        description: 'Branch/SHA for foundational-packages checkout'
        required: false

      enterprise_ref:
        description: 'Branch/SHA for enterprise-packages checkout'
        required: false

jobs:
  # NOTE: This does NOT use `uses:` to call build-and-stage-packages.yml as a reusable
  # workflow. enterprise-packages is a private/internal repo whose "Access to
  # reusable workflows" setting only permits callers that are themselves
  # private or internal repos. foundational-packages is public, so GitHub
  # blocks that reference entirely ("workflow was not found"), regardless of
  # the Access setting. Instead, this dispatches build-and-stage-packages.yml's own
  # workflow_dispatch trigger via the API/CLI, which only requires GH_TOKEN to
  # have write access to enterprise-packages and is unaffected by the
  # public/private restriction above.
  trigger-enterprise-build:
    runs-on: ubuntu-24.04
    env:
      # TEMPORARY: testing a minimal-scope fine-grained PAT before handing the
      # recipe to build-services. Revert to secrets.GH_TOKEN once confirmed.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Dispatch enterprise-packages build
        id: dispatch
        env:
          FOUNDATIONAL_REF: ${{ inputs.foundational_ref || 'base-2025' }}
          ENTERPRISE_REF: ${{ inputs.enterprise_ref || 'base-2025' }}
          # Debounce only automatic pushes. Refs stay as branch names so the surviving run builds the newest merges.
          DEBOUNCE: ${{ github.event_name == 'push' }}
          DISPATCH_ID: foundational-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh workflow run build-and-stage-packages.yml \
            --repo habitat-sh/enterprise-packages \
            --ref "$ENTERPRISE_REF" \
            -f "enterprise_ref=$ENTERPRISE_REF" \
            -f "foundational_ref=$FOUNDATIONAL_REF" \
            -f "debounce=$DEBOUNCE" \
            -f "dispatch_id=$DISPATCH_ID"

          # `gh workflow run` doesn't return a run ID, so find the run whose
          # name carries this job's unique dispatch id.
          run_id=""
          for _ in $(seq 1 12); do
            run_id="$(gh run list \
              --repo habitat-sh/enterprise-packages \
              --workflow build-and-stage-packages.yml \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle \
              --jq "[.[] | select(.displayTitle | contains(\"[$DISPATCH_ID]\"))] | first | .databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched enterprise-packages run"
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Build run: https://github.com/habitat-sh/enterprise-packages/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for enterprise-packages build
        run: |
          run_id="${{ steps.dispatch.outputs.run_id }}"
          gh run watch "$run_id" --repo habitat-sh/enterprise-packages || true
          conclusion="$(gh run view "$run_id" --repo habitat-sh/enterprise-packages --json conclusion --jq .conclusion)"
          case "$conclusion" in
            success) ;;
            cancelled) echo "::notice::Enterprise build $run_id was cancelled, likely superseded by a newer merge." ;;
            *) echo "::error::Enterprise build $run_id concluded with '$conclusion'"; exit 1 ;;
          esac
