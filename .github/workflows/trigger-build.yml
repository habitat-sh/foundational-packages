name: Trigger Enterprise Build

on:
  push:
    branches:
      - base-2025
  # Allows manually re-running/testing this trigger from the Actions tab or
  # `gh workflow run`, independent of the push trigger required by the story.
  workflow_dispatch:
    inputs:
      foundational_ref:
        description: 'Branch/SHA for foundational-packages checkout'
        required: false

jobs:
  # NOTE: This does NOT use `uses:` to call build-packages.yml as a reusable
  # workflow. enterprise-packages is a private/internal repo whose "Access to
  # reusable workflows" setting only permits callers that are themselves
  # private or internal repos. foundational-packages is public, so GitHub
  # blocks that reference entirely ("workflow was not found"), regardless of
  # the Access setting. Instead, this dispatches build-packages.yml's own
  # workflow_dispatch trigger via the API/CLI, which only requires GH_TOKEN to
  # have write access to enterprise-packages and is unaffected by the
  # public/private restriction above.
  trigger-enterprise-build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Dispatch enterprise-packages build
        id: dispatch
        run: |
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run build-packages.yml \
            --repo habitat-sh/enterprise-packages \
            --ref base-2025 \
            -f foundational_ref="${{ inputs.foundational_ref || github.sha }}"

          # `gh workflow run` doesn't return a run ID, so poll for the newest
          # run of this workflow created after the dispatch above.
          run_id=""
          for _ in $(seq 1 12); do
            run_id="$(gh run list \
              --repo habitat-sh/enterprise-packages \
              --workflow build-packages.yml \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt > \"$before\")] | sort_by(.createdAt) | last | .databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched enterprise-packages run"
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Build run: https://github.com/habitat-sh/enterprise-packages/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for enterprise-packages build
        run: |
          gh run watch "${{ steps.dispatch.outputs.run_id }}" \
            --repo habitat-sh/enterprise-packages \
            --exit-status
